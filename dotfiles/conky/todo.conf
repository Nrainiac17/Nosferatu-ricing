conky.config = {
    -- Window settings
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    update_interval = 5, -- Updates every 5 seconds to show newly added tasks

    -- Positioning (Placed on bottom right)
    alignment = 'bottom_right',
    gap_x = 20,
    gap_y = 40,
    minimum_width = 280,
    minimum_height = 150,

    -- Styling
    font = 'Sans:size=10',
    default_color = '#ffffff',
}

conky.text = [[
${color #f1fa8c}${font Sans:bold:size=11} TO-DO LIST ${font}${color #555555}${hr 2}
# Reads the top 5 lines of your todo.txt file
${color #ffffff}${execi 5 head -n 5 ~/.config/todo/todo.txt | sed 's/^/- /'}
]]
