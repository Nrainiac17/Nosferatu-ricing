-- Configuration settings: https://conky.cc/config_settings

conky.config = {
    alignment = 'top_left',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2, 
    default_outline_color = 'white',
    default_shade_color = 'black',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = true,
    extra_newline = false,
    gap_x = 10,
    gap_y = 60,
    minimum_height = 200,
    minimum_width = 200,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = true,
    out_to_x = false,
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0, -- Lowered so the window responds/draws properly
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    
    -- Window settings (Wayland style)
    own_window = true,
    own_window_class = 'conky',
    own_window_type = 'desktop',     
    own_window_transparent = true,
    own_window_argb_visual = false,      
    own_window_colour = '#000000',
    
    -- Styling
    font = 'sans-serif:size=10',
    default_color = '#ffffffff',               
}

conky.text = [[ 
${execpi 1800 ~/.config/conky/weather.sh}
# Top Row: City Name and Weather Icon
#${voffset 10}${goto 20}${font JetBrainsMono Nerd Font:bold:size=16}Thane${alignr 20} 󰖐${font}

# Middle: Massive Temperature
#${voffset -10}${goto 20}${font :medium:size=48}28°${font}

# Bottom: Condition and High/Low
#${voffset 5} ${goto 20}${font sans-serif:bold:size=11}   Mostly Clear ${font}
#${voffset 2} ${goto 20}${font sans-serif:size=11}   H:32°     L:24°${font}
]]
