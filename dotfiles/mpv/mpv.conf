# ~/.config/mpv/mpv.conf

# Force GPU hardware video decoding (Works for Intel/AMD/Nvidia)
hwdec=auto

# Performance optimizations for background playback
vo=gpu
profile=fast

# Keep a healthy memory cache so a slow HDD doesn't cause frame drops
cache=yes
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=25MiB
